# SUPERSEDED by nq_orb5_v2 BEFORE any evaluation (only the data line changed: BID-only candles). Never run.
# STRATEGY PRE-REGISTRATION (10-point specification) - do not edit after evaluation; the lab stores the SHA-256.
# Built from scratch with the user (market NQ/Nasdaq M5, risk 1% per trade, 2% per day).
name: nq_orb5_v1
market: NAS100 (Dukascopy USATECHIDXUSD CFD, proxy for NQ futures), 1-minute bars aggregated as needed
registered_by: X-QUANT with the user, 2026-10-04 - written before any NAS100 minute data outcome was computed (download
  still running)
inspiration: 5-minute opening-range breakout studied on the Nasdaq-100 ETF in recent SSRN work (Zarattini, Barbon
  & Aziz, 2023). The rules below are this lab's own fixed specification, not a reproduction of that paper; its sample
  (to 2023) overlaps 2017-2023 here, so only data after mid-2024 (FINAL split) is post-publication.
1_context: 'US cash session days (09:30-16:00 New York). Variant A: every such day. Variant B: only in the direction
  of the weekly VWAP (tick-volume weighted, anchored Sunday 17:00 NY): longs only if the 09:35 close is above it,
  shorts only if below.'
2_setup: 'The first 5-minute candle of the cash session (09:30-09:35 NY) has a directional body: |close - open|
  >= 10% of its high-low range. Bullish body -> long setup; bearish body -> short setup.'
3_entry: Market order at the open of the first minute after 09:35 (09:35:00), in the direction of the setup. One
  trade per day maximum.
4_stop_loss: 'The opposite extreme of the opening candle: its low for longs, its high for shorts. 1R = |entry -
  stop|. If a minute bar opens beyond the stop, the fill is that bar''s open (gap risk).'
5_take_profit: 10R; if neither stop nor target is hit, exit at the 16:00 New York close. If stop and target are
  touched in the same minute, the stop is assumed first.
6_risk_management: Risk 1% of equity per trade (size = 1% equity / stop distance), notional capped at 4x equity
  (a capped trade risks less than 1%). Daily loss limit 2% of equity; with one trade per day it binds only through
  gaps or slippage beyond the stop.
7_no_trade: 'No trade if: the opening candle is a doji (body < 10% of range); the stop distance is below 0.03% of
  price (unexecutable) ; the session has no 09:35 or 16:00 bar in the data (holiday / half day / gap in data). Not
  implemented for lack of a reliable historical calendar (declared, not invented): skipping FOMC/CPI/NFP days.'
8_edge: 'Measured in R per trade net of costs (NQ-futures-like: ~0.435 bps per fill = half spread 0.125 + commission
  0.06 + slippage 0.25), and as daily returns at 1% risk.'
9_backtest:
  data: Dukascopy 1-minute BID+ASK mid, 2017-01 to 2026-09
  splits:
    train_end: '2020-12-31'
    validation_end: '2022-12-31'
    test_end: '2024-06-30'
  pass_rule: 'On TRAIN+VALIDATION (nothing is fitted): mean net R > 0 with stationary-bootstrap 95% CI lower bound
    > 0; deflated Sharpe of daily returns >= 0.95 with N = variants registered for this market; >= 50% profitable
    years; beats random direction on the same days with the same stops (p < 0.05); still positive at 2x costs and
    with entry delayed one minute. Then TEST once (mean R > 0), then FINAL once for the best variant.'
10_execution: 'Fully mechanical: the checklist is the rules above (time, candle body, side, stop price, size formula,
  target, 16:00 exit). No discretionary step exists to skip.'
variants:
- id: A
  context: none
- id: B
  context: weekly_vwap_side
