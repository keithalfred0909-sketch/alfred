# XAUUSD_H1 plus XAGUSD hourly as a same-bar cross-asset: enables relative-value features (x_px_silver_relz*).
asset:
  symbol: XAUUSD_H1_RV
  name: XAU/USD (1h) + relative value
  market: metals
  timeframe: 1h
  timezone: America/New_York
  price_source:
    kind: dukascopy_candles
    params:
      instrument: XAUUSD
      start: '2008-01-01'
      end: '2026-10-01'
      granularity: hour
      point: 0.001
      expected_range:
      - 200
      - 10000
  cross_check:
    kind: monthly_mean
    source:
      kind: datahub_csv
      params:
        url: https://raw.githubusercontent.com/datasets/gold-prices/main/data/monthly.csv
        date_col: Date
        value_col: Price
        snapshot: gold_monthly_worldbank.csv
    max_median_pct: 1.5
    min_return_corr: 0.9
  costs:
    spread_bps: 2.0
    commission_bps: 0.5
    slippage_bps: 1.0
    latency_bars: 0
    use_data_spread: true
  splits:
    train_end: 2018-12-31
    validation_end: 2020-12-31
    test_end: 2022-12-31
    embargo_bars: 120
  macro:
  - name: us_cpi_yoy
    frequency: monthly
    timezone: America/New_York
    availability_lag_days: 35
    transform: yoy
    description: US CPI-U YoY (BLS), 35-day lag
    source:
      kind: datahub_csv
      params:
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        date_col: Date
        value_col: Index
        snapshot: us_cpi.csv
  - name: us_10y_yield
    frequency: monthly
    timezone: America/New_York
    availability_lag_days: 1
    transform: level
    description: US 10Y yield monthly average (Fed H.15)
    source:
      kind: datahub_csv
      params:
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        date_col: Date
        value_col: Rate
        snapshot: us_10y_monthly.csv
  cross_assets:
  - name: vix
    frequency: daily
    timezone: America/New_York
    availability_lag_days: 0
    transform: level
    description: CBOE VIX close, usable from the end of its NY day
    source:
      kind: datahub_csv
      params:
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        date_col: DATE
        value_col: CLOSE
        snapshot: vix_daily.csv
  - name: brent
    frequency: daily
    timezone: America/New_York
    availability_lag_days: 1
    transform: level
    description: Brent spot (EIA), next NY day
    source:
      kind: datahub_csv
      params:
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        date_col: Date
        value_col: Price
        snapshot: brent_daily.csv
  - name: px_silver
    frequency: bar
    timezone: UTC
    availability_lag_days: 0
    transform: level
    description: XAGUSD hourly mid close (Dukascopy), known at the same bar close
    source:
      kind: dukascopy_candles
      params:
        instrument: XAGUSD
        start: '2008-01-01'
        end: '2026-10-01'
        granularity: hour
        point: 0.001
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
