# EUR/USD hourly - intraday laboratory. Requires datafeed.dukascopy.com in the environment's allowed domains.
# Bars: Dukascopy BID+ASK hourly candles -> mid OHLC, observed spread, tick volume; stamped at bar close (UTC).
# The source is cross-checked against the Fed H.10 noon fixing (configs/assets/eurusd.yaml) before any research.
asset:
  symbol: EURUSD_H1
  name: EUR/USD (1h)
  market: fx
  timeframe: 1h
  timezone: America/New_York      # FX day convention; hour-of-day features follow New York DST
  price_source:
    kind: dukascopy_candles
    params: {instrument: EURUSD, start: "2005-01-01", end: "2026-10-01", granularity: hour, point: 0.00001,
             expected_range: [0.8, 1.8]}
  cross_check: {asset: EURUSD, local_time: "12:00", tz: America/New_York, max_median_bps: 10, min_return_corr: 0.9}
  costs:
    spread_bps: 0.8               # floor; the observed per-bar spread is charged when wider
    commission_bps: 0.35          # per fill (~$3.5 per 100k per side)
    slippage_bps: 0.3             # per fill
    latency_bars: 0
    use_data_spread: true
  splits:
    train_end: 2016-12-31
    validation_end: 2019-12-31
    test_end: 2022-12-31          # FINAL out-of-sample = 2023 onward
    embargo_bars: 120             # ~5 trading days of hourly bars
  macro:
    - name: us_cpi_yoy
      description: US CPI-U YoY (BLS). Released ~2 weeks after month end; conservative 35-day lag.
      frequency: monthly
      timezone: America/New_York
      availability_lag_days: 35
      transform: yoy
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv, date_col: Date, value_col: Index, snapshot: us_cpi.csv}}
    - name: us_10y_yield
      description: US 10Y yield, monthly average (Fed H.15). Known at month end.
      frequency: monthly
      timezone: America/New_York
      availability_lag_days: 1
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv, date_col: Date, value_col: Rate, snapshot: us_10y_monthly.csv}}
  cross_assets:
    - name: vix
      description: CBOE VIX close (16:15 New York). Usable from the end of its New York day.
      frequency: daily
      timezone: America/New_York
      availability_lag_days: 0
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv, date_col: DATE, value_col: CLOSE, snapshot: vix_daily.csv}}
    - name: brent
      description: Brent spot (EIA). Publication time uncertain; usable from the next New York day.
      frequency: daily
      timezone: America/New_York
      availability_lag_days: 1
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv, date_col: Date, value_col: Price, snapshot: brent_daily.csv}}

stats:
  horizons: [1, 3, 6, 12, 24]
  min_trades: 60
