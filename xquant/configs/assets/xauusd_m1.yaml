# XAU/USD 1-minute Dukascopy BID+ASK candles, 2022-2026 (format verified on the live feed). Base dataset for
# M15/M30; cross-checked monthly vs World Bank. Shorter history than H1 (minute files are one per day).
asset:
  costs:
    commission_bps: 0.5
    latency_bars: 0
    slippage_bps: 1.0
    spread_bps: 2.0
    use_data_spread: true
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close, usable from the end of its NY day
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA), next NY day
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  cross_check:
    kind: monthly_mean
    max_median_pct: 1.5
    min_return_corr: 0.9
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: gold_monthly_worldbank.csv
        url: https://raw.githubusercontent.com/datasets/gold-prices/main/data/monthly.csv
        value_col: Price
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS), 35-day lag
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield monthly average (Fed H.15)
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: metals
  name: XAU/USD (1min, base for M15/M30)
  price_source:
    kind: dukascopy_candles
    params:
      end: '2026-10-01'
      expected_range:
      - 200
      - 10000
      granularity: minute
      instrument: XAUUSD
      point: 0.001
      start: '2022-01-01'
  splits:
    train_end: '2024-06-30'
    validation_end: '2025-03-31'
    test_end: '2025-12-31'
    embargo_bars: 1440
  symbol: XAUUSD_M1
  timeframe: 1min
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
