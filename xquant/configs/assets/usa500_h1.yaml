# S&P 500 1h bars aggregated from USA500_M1 (BID 1-minute, 2017-2026); ES-futures-like costs as NAS100_M30.
asset:
  costs:
    spread_bps: 0.25
    commission_bps: 0.06
    slippage_bps: 0.25
    latency_bars: 0
    use_data_spread: false
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close, usable from the end of its NY day
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA), next NY day
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS), 35-day lag
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield monthly average (Fed H.15)
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: index_cfd
  name: S&P 500 CFD (1h)
  price_source:
    kind: resample_asset
    params:
      asset: USA500_M1
      session_close: '17:00'
      tz: America/New_York
      hours: 1
      min_bars: 30
  splits:
    train_end: '2020-12-31'
    validation_end: '2022-12-31'
    test_end: '2024-06-30'
    embargo_bars: 48
  symbol: USA500_H1
  timeframe: 1h
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
