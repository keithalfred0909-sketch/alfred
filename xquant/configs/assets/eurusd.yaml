# EUR/USD - first laboratory asset.
# Price source available from this environment: Federal Reserve H.10 daily noon buying rates (New York),
# redistributed by datahub.io (public domain). One observation per US business day: CLOSE ONLY, no
# open/high/low, no volume. Engines that need intraday or OHLC data will report INSUFFICIENT DATA.
# For intraday research switch price_source to `dukascopy` (needs datafeed.dukascopy.com allowed) or `csv_file`.
asset:
  symbol: EURUSD
  name: EUR/USD
  market: fx
  timeframe: 1D
  timezone: America/New_York
  price_source:
    kind: datahub_csv
    params:
      url: https://raw.githubusercontent.com/datasets/exchange-rates/main/data/daily.csv
      date_col: Date
      value_col: Exchange rate
      filter_col: Country
      filter_value: Euro
      # The redistributed file stores EUR per USD. Orientation is verified against a known anchor
      # (DEXUSEU 1999-01-04 = 1.1812 USD per EUR) and inverted only if the check confirms it.
      orientation_anchor: {date: "1999-01-04", value: 1.1812, tolerance: 0.002}
      snapshot: eurusd_fed_h10_daily.csv
      close_time: "12:00"        # noon buying rate, New York
  costs:
    spread_bps: 1.0
    commission_bps: 0.5
    slippage_bps: 0.5
    latency_bars: 0
  splits:
    train_end: 2014-12-31
    validation_end: 2018-12-31
    test_end: 2022-12-31     # FINAL out-of-sample = everything after test_end
    embargo_bars: 20
  macro:
    - name: us_cpi_yoy
      description: US CPI-U all items (BLS), year-over-year %. Stamped at reference month; released ~2 weeks after month end.
      frequency: monthly
      availability_lag_days: 35
      transform: yoy
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv, date_col: Date, value_col: Index, snapshot: us_cpi.csv}}
    - name: us_10y_yield
      description: US 10Y Treasury yield, monthly average (Fed H.15). Known at month end.
      frequency: monthly
      availability_lag_days: 1
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv, date_col: Date, value_col: Rate, snapshot: us_10y_monthly.csv}}
  cross_assets:
    - name: vix
      description: CBOE VIX close. Closes after the NY noon fix, so usable from the next bar.
      frequency: daily
      availability_lag_days: 1
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv, date_col: DATE, value_col: CLOSE, snapshot: vix_daily.csv}}
    - name: brent
      description: Brent spot (EIA). Usable from the next bar.
      frequency: daily
      availability_lag_days: 1
      transform: level
      source: {kind: datahub_csv, params: {url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv, date_col: Date, value_col: Price, snapshot: brent_daily.csv}}
  calendar_source: null      # e.g. {kind: econ_calendar_csv, params: {path: datasets/calendar.csv}} - needs consensus data
  news_source: null          # e.g. {kind: news_csv, params: {path: datasets/news.csv}}
