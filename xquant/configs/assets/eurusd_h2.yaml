# EURUSD 2-hour bars aggregated from the validated hourly Dukascopy bars (eurusd_h1.yaml),
# aligned so a bar closes at 17:00 New York. No extra download; inherits H1 validation.
asset:
  costs:
    commission_bps: 0.35
    latency_bars: 0
    slippage_bps: 0.3
    spread_bps: 0.8
    use_data_spread: true
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close (16:15 New York). Usable from the end of its New York
      day.
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA). Publication time uncertain; usable from the next
      New York day.
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS). Released ~2 weeks after month end; conservative
      35-day lag.
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield, monthly average (Fed H.15). Known at month end.
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: fx
  name: EUR/USD (2h)
  price_source:
    kind: resample_asset
    params:
      asset: EURUSD_H1
      hours: 2
      session_close: '17:00'
      tz: America/New_York
  splits:
    embargo_bars: 60
    test_end: 2022-12-31
    train_end: 2016-12-31
    validation_end: 2019-12-31
  symbol: EURUSD_H2
  timeframe: 2h
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 40
