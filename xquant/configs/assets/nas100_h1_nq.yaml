# Same data as NAS100_H1 (Dukascopy USATECHIDXUSD hourly) evaluated with NQ-futures-like costs: spread 0.25 bps,
# commission 0.06 bps, slippage 0.25 bps per fill (~0.87 bps round trip); the CFD's own spread is NOT charged.
# Separate symbol so its research memory and multiple-testing family are separate from NAS100_H1 (CFD costs).
asset:
  costs:
    spread_bps: 0.25
    commission_bps: 0.06
    slippage_bps: 0.25
    latency_bars: 0
    use_data_spread: false
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close, usable from the end of its NY day
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA), next NY day
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS), 35-day lag
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield monthly average (Fed H.15)
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: index_cfd
  name: Nasdaq 100 CFD (1h), NQ-futures-like costs
  price_source:
    kind: dukascopy_candles
    params:
      instrument: USATECHIDXUSD
      start: '2013-01-01'
      end: '2026-10-01'
      granularity: hour
      point: 0.001
      expected_range:
      - 1500
      - 40000
  splits:
    train_end: '2019-12-31'
    validation_end: '2021-12-31'
    test_end: '2023-12-31'
    embargo_bars: 120
  symbol: NAS100_H1_NQ
  timeframe: 1h
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
