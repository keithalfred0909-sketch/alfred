# Nasdaq 100 30-minute bars aggregated from NAS100_M1, aligned to 17:00 New York (bars close at :00/:30 NY).
# COSTS are NQ-futures-like (the CFD's own spread is NOT charged): spread 0.25 bps (~2 ticks at NQ 20,000),
# commission 0.06 bps and slippage 0.25 bps per fill -> ~0.87 bps per round trip. Use use_data_spread: true
# (and the NAS100_H1 costs) for a CFD account. Splits: TRAIN 2017-2020, VALIDATION 2021-22, TEST 2023-24H1, FINAL after.
asset:
  costs:
    spread_bps: 0.25
    commission_bps: 0.06
    slippage_bps: 0.25
    latency_bars: 0
    use_data_spread: false
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close, usable from the end of its NY day
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA), next NY day
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS), 35-day lag
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield monthly average (Fed H.15)
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: index_cfd
  name: Nasdaq 100 CFD (30m)
  price_source:
    kind: resample_asset
    params:
      asset: NAS100_M1
      minutes: 30
      min_bars: 15
      session_close: '17:00'
      tz: America/New_York
  splits:
    train_end: '2020-12-31'
    validation_end: '2022-12-31'
    test_end: '2024-06-30'
    embargo_bars: 48
  symbol: NAS100_M30
  timeframe: 30min
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
