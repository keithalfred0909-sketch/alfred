# Nasdaq 100 CFD (Dukascopy USATECHIDXUSD) 1-minute BID+ASK candles, 2017-2026. Base dataset for NAS100_M30.
# Same caveats as NAS100_H1: proxy for NQ futures, tick volume only (no order flow), no independent cross-check.
# BID candles only (no ASK download): the studies on this data charge fixed NQ-futures-like costs, so the
# bid-ask spread is not needed; prices are bids (shifted by half a spread vs mid), spread column empty.
asset:
  costs:
    spread_bps: 1.5
    commission_bps: 0.0
    slippage_bps: 1.0
    latency_bars: 0
    use_data_spread: true
  cross_assets:
  - availability_lag_days: 0
    description: CBOE VIX close, usable from the end of its NY day
    frequency: daily
    name: vix
    source:
      kind: datahub_csv
      params:
        date_col: DATE
        snapshot: vix_daily.csv
        url: https://raw.githubusercontent.com/datasets/finance-vix/main/data/vix-daily.csv
        value_col: CLOSE
    timezone: America/New_York
    transform: level
  - availability_lag_days: 1
    description: Brent spot (EIA), next NY day
    frequency: daily
    name: brent
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: brent_daily.csv
        url: https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv
        value_col: Price
    timezone: America/New_York
    transform: level
  macro:
  - availability_lag_days: 35
    description: US CPI-U YoY (BLS), 35-day lag
    frequency: monthly
    name: us_cpi_yoy
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_cpi.csv
        url: https://raw.githubusercontent.com/datasets/cpi-us/main/data/cpiai.csv
        value_col: Index
    timezone: America/New_York
    transform: yoy
  - availability_lag_days: 1
    description: US 10Y yield monthly average (Fed H.15)
    frequency: monthly
    name: us_10y_yield
    source:
      kind: datahub_csv
      params:
        date_col: Date
        snapshot: us_10y_monthly.csv
        url: https://raw.githubusercontent.com/datasets/bond-yields-us-10y/main/data/monthly.csv
        value_col: Rate
    timezone: America/New_York
    transform: level
  market: index_cfd
  name: Nasdaq 100 CFD (1m)
  price_source:
    kind: dukascopy_candles
    params:
      instrument: USATECHIDXUSD
      start: '2017-01-01'
      end: '2026-10-01'
      granularity: minute
      point: 0.001
      expected_range:
      - 1500
      - 40000
      sides:
      - BID
  splits:
    train_end: '2020-12-31'
    validation_end: '2022-12-31'
    test_end: '2024-06-30'
    embargo_bars: 1440
  symbol: NAS100_M1
  timeframe: 1m
  timezone: America/New_York
stats:
  horizons:
  - 1
  - 3
  - 6
  - 12
  - 24
  min_trades: 60
